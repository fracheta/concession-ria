<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo - Revenda de Veículos Premium</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0e12;
      color: #eaeaea;
      line-height: 1.6;
    }

    header {
      background: rgba(13, 14, 18, 0.95);
      padding: 1rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2c35;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
      letter-spacing: -1px;
    }

    .logo span {
      color: #eaeaea;
      font-weight: 300;
    }

    .btn-header {
      background: transparent;
      color: #38bdf8;
      padding: 0.7rem 1.5rem;
      border: 2px solid #38bdf8;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .btn-header:hover {
      background: #38bdf8;
      color: #0d0e12;
    }

    .hero {
      text-align: left;
      padding: 8rem 3rem 6rem;
      background: radial-gradient(circle at center, #1e293b 0%, #0d0e12 100%);
      border-bottom: 1px solid #2a2c35;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .hero p {
      font-size: 1.3rem;
      color: #94a3b8;
      max-width: 700px;
      margin-bottom: 3rem;
      font-weight: 300;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 3rem 6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
    }

    .card {
      background: #111218;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2c35;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      border-color: #38bdf8;
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      filter: grayscale(20%);
      transition: filter 0.4s ease;
    }

    .card:hover img {
      filter: grayscale(0%);
    }

    .card-body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .card-info {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-weight: 300;
    }

    .card-price {
      font-size: 1.8rem;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 2rem;
      margin-top: auto;
      letter-spacing: -1px;
    }

    .card-btn {
      width: 100%;
      background: #25d366;
      color: #ffffff;
      border: none;
      padding: 1rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .card-btn:hover {
      background: #1da851;
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 3rem;
      background: #090a0d;
      color: #52525b;
      font-size: 0.9rem;
      border-top: 1px solid #2a2c35;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">SUA<span>EMPRESA</span></a>
    <a id="nav-zap" href="#" target="_blank" class="btn-header">Falar no WhatsApp</a>
  </header>

  <section class="hero">
    <h1>Encontre Seu<br>Veículo Ideal</h1>
    <p>Explore nossa seleção exclusiva de veículos e entre em contato direto pelo WhatsApp para atendimento personalizado e simulações.</p>
  </section>

  <main class="container">
    <div class="grid" id="car-grid"></div>
  </main>

  <footer>
    <p>&copy; 2026 Nome da Empresa. Todos os direitos reservados.</p>
  </footer>

  <script>
    const TELEFONO_WHATSAPP = "5500999999999";

    const carros = [
      {
        nome: "Executive Sedan Sport",
        detalhes: "Ano 2023 • 20.000 km • Flex • Automático",
        preco: "R$ 000.000",
        imagem: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800&q=80"
      },
      {
        nome: "Premium SUV 4x4",
        detalhes: "Ano 2024 • 10.000 km • Diesel • Completo",
        preco: "R$ 000.000",
        imagem: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=800&q=80"
      },
      {
        nome: "Urban Hatchback Pro",
        detalhes: "Ano 2022 • 35.000 km • Flex • Manual",
        preco: "R$ 00.000",
        imagem: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=800&q=80"
      },
      {
        nome: "Rugged Pickup Truck",
        detalhes: "Ano 2023 • 15.000 km • Diesel • 4x4",
        preco: "R$ 000.000",
        imagem: "https://images.unsplash.com/photo-1533106497176-45ae19e68ba2?w=800&q=80"
      }
    ];

    document.getElementById('nav-zap').href = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent("Olá! Gostaria de mais informações sobre os veículos disponíveis.")}`;

    const grid = document.getElementById('car-grid');

    carros.forEach(carro => {
      const mensagem = encodeURIComponent(`Olá! Tenho interesse no veículo: ${carro.nome}. Poderia me enviar mais detalhes?`);
      const urlZap = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensagem}`;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${carro.imagem}" alt="${carro.nome}">
        <div class="card-body">
          <h2 class="card-title">${carro.nome}</h2>
          <p class="card-info">${carro.detalhes}</p>
          <div class="card-price">${carro.preco}</div>
          <a href="${urlZap}" target="_blank" class="card-btn">Chamar no WhatsApp</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
